name: Daily Instagram Post

on:
  schedule:
    - cron: "0 17 * * *"   # ~noon US Central, daily
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      test_run:
        description: "Test run: write + render only, don't post (video is attached to the run)"
        type: boolean
        default: false
      jokes_only:
        description: "Joke check: print jokes for 5 headlines, no render, no post"
        type: boolean
        default: false
      model:
        description: "Joke model (scheduled runs always use the default)"
        type: choice
        default: qwen35-4b
        options:
          - qwen35-9b
          - qwen35-4b
          - qwen3-4b

permissions:
  contents: write           # to commit posted.json / history.json back
  pages: write              # to deploy today's video to GitHub Pages
  id-token: write           # required by actions/deploy-pages

# One run at a time: two overlapping runs would fight over the Pages site
# and could publish each other's video.
concurrency:
  # Joke checks never touch Pages or Instagram, so each gets its own group
  # and they can run side by side.
  group: ${{ inputs.jokes_only && format('jokes-{0}', github.run_id) || 'daily-post' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"     # stream bot logs live instead of at exit
  BLENDER_VERSION: "4.5.12"
  # The joke model runs on this machine — no API, key, or account. The engine
  # build and each model file are pinned, and the model is checked against
  # its published SHA-256 so a changed or corrupt file can't run.
  LLAMA_BUILD: "b11978"
  # Scheduled runs have no inputs, so this is the production model.
  DEFAULT_MODEL: "qwen35-4b"  # won the 2026-10-30 joke check vs qwen35-9b, qwen3-4b

jobs:
  post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libgl1 is only the GLVND dispatcher — EEVEE needs a real driver,
          # which on a GPU-less runner means Mesa's llvmpipe (libgl1-mesa-dri).
          sudo apt-get install -y xvfb libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libgl1 libgl1-mesa-dri libglx-mesa0 libxkbcommon0 \
            libsm6 libice6 ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      # restore + explicit save (instead of actions/cache) so the download is
      # cached even when a later step fails — the plain action only saves at
      # the end of a fully successful job.
      - name: Restore Blender
        id: cache-blender
        uses: actions/cache/restore@v4
        with:
          path: blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          # Official host first, then mirrors — some networks block download.blender.org.
          urls=(
            "https://download.blender.org/release/Blender4.5/${file}"
            "https://mirrors.dotsrc.org/blender/blender-release/Blender4.5/${file}"
            "https://ftp.nluug.nl/pub/graphics/blender/release/Blender4.5/${file}"
          )
          for url in "${urls[@]}"; do
            echo "Trying ${url}"
            if ! curl -fsSL --retry 3 --connect-timeout 20 "${url}" -o blender.tar.xz; then
              continue
            fi
            # Keep tar as its own statement: in an `a && b` list, a failing
            # `a` is exempt from `set -e`, so a bad archive would fall through
            # to the success path and mark this step green with no Blender.
            if ! tar -xf blender.tar.xz; then
              echo "Archive from ${url} is not a valid tarball, trying next"
              rm -f blender.tar.xz
              continue
            fi
            rm -f blender.tar.xz
            echo "Downloaded and extracted from ${url}"
            exit 0
          done
          echo "All Blender download sources failed" >&2
          exit 1

      - name: Save Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Add Blender to PATH
        run: echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"

      - name: Pick joke model
        env:
          CHOSEN: ${{ inputs.model }}
        run: |
          set -euo pipefail
          model="${CHOSEN:-$DEFAULT_MODEL}"
          case "$model" in
            qwen35-9b)
              url="https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-Q4_K_M.gguf"
              sha="03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8" ;;
            qwen35-4b)
              url="https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf"
              sha="00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4" ;;
            qwen3-4b)
              url="https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/a06e946bb6b655725eafa393f4a9745d460374c9/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
              sha="3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597" ;;
            *) echo "unknown model: $model" >&2; exit 1 ;;
          esac
          echo "joke model: $model"
          { echo "MODEL_URL=$url"; echo "MODEL_SHA256=$sha"; } >> "$GITHUB_ENV"

      - name: Restore joke model
        id: cache-llm
        uses: actions/cache/restore@v4
        with:
          path: llm
          key: llm-${{ env.LLAMA_BUILD }}-${{ env.MODEL_SHA256 }}

      - name: Download joke model
        if: steps.cache-llm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p llm
          curl -fsSL --retry 3 -o llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          tar -xzf llama.tar.gz -C llm
          rm -f llama.tar.gz
          curl -fsSL --retry 3 -o llm/model.gguf "${MODEL_URL}"
          echo "${MODEL_SHA256}  llm/model.gguf" | sha256sum -c -

      - name: Save joke model
        if: steps.cache-llm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llm
          key: llm-${{ env.LLAMA_BUILD }}-${{ env.MODEL_SHA256 }}

      - name: Start joke model server
        run: |
          set -euo pipefail
          bin="$PWD/llm/llama-${LLAMA_BUILD}"
          export LD_LIBRARY_PATH="${bin}:${LD_LIBRARY_PATH:-}"
          nohup "${bin}/llama-server" -m llm/model.gguf \
            --host 127.0.0.1 --port 8080 -c 4096 -t "$(nproc)" \
            > llama-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "model server ready after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "model server failed to start:" >&2
          tail -n 40 llama-server.log >&2
          exit 1

      - name: Joke check — jokes for 5 headlines, nothing else
        if: ${{ inputs.jokes_only }}
        run: python bot.py --jokes 5

      - name: Test run — write and render only
        if: ${{ inputs.test_run && !inputs.jokes_only }}
        run: xvfb-run -a python bot.py --dry-run

      - name: Attach test video to this run
        if: ${{ inputs.test_run && !inputs.jokes_only }}
        uses: actions/upload-artifact@v4
        with:
          name: test-post
          path: out/

      - name: Write and render today's post
        if: ${{ !inputs.test_run && !inputs.jokes_only }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: xvfb-run -a python bot.py --prepare

      # Instagram's API only accepts media from a public URL, so the rendered
      # video is served from GitHub Pages. Each deploy replaces the whole
      # site, so only today's file is ever public there.
      - name: Upload media for Pages
        if: ${{ !inputs.test_run && !inputs.jokes_only }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy media to Pages
        if: ${{ !inputs.test_run && !inputs.jokes_only }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        if: ${{ !inputs.test_run && !inputs.jokes_only }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python bot.py --publish "${{ steps.deployment.outputs.page_url }}"

      - name: Show joke model log (on failure)
        if: failure()
        run: tail -n 60 llama-server.log 2>/dev/null || echo "no model log"

      - name: Commit posted history
        # always(): when a publish may have gone through but couldn't be
        # confirmed, bot.py records the topic and then exits non-zero on
        # purpose. Skipping this step on failure would discard exactly the
        # record that prevents a duplicate post tomorrow.
        if: always()
        run: |
          set -euo pipefail
          git config user.name "ig-bot"
          git config user.email "actions@github.com"
          git add posted.json history.json
          git diff --cached --quiet && { echo "nothing to record"; exit 0; }
          git commit -m "Record post history and insights"
          # The job runs for many minutes (render + Instagram polling), so the
          # branch may have moved. A bare push would reject and lose the
          # dedupe key for a post that is already live.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt ${attempt})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Failed to push posted.json after 3 attempts" >&2
          exit 1
