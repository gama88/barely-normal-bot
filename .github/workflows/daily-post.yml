name: Daily Instagram Post

on:
  schedule:
    - cron: "0 17 * * *"   # ~noon US Central, daily
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write           # to commit posted.json back

env:
  BLENDER_VERSION: "4.5.12"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libgl1 is only the GLVND dispatcher — EEVEE needs a real driver,
          # which on a GPU-less runner means Mesa's llvmpipe (libgl1-mesa-dri).
          sudo apt-get install -y xvfb libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libgl1 libgl1-mesa-dri libglx-mesa0 libxkbcommon0 \
            libsm6 libice6 ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          # Official host first, then mirrors — some networks block download.blender.org.
          urls=(
            "https://download.blender.org/release/Blender4.5/${file}"
            "https://mirrors.dotsrc.org/blender/blender-release/Blender4.5/${file}"
            "https://ftp.nluug.nl/pub/graphics/blender/release/Blender4.5/${file}"
          )
          for url in "${urls[@]}"; do
            echo "Trying ${url}"
            if ! curl -fsSL --retry 3 --connect-timeout 20 "${url}" -o blender.tar.xz; then
              continue
            fi
            # Keep tar as its own statement: in an `a && b` list, a failing
            # `a` is exempt from `set -e`, so a bad archive would fall through
            # to the success path and mark this step green with no Blender.
            if ! tar -xf blender.tar.xz; then
              echo "Archive from ${url} is not a valid tarball, trying next"
              rm -f blender.tar.xz
              continue
            fi
            rm -f blender.tar.xz
            echo "Downloaded and extracted from ${url}"
            exit 0
          done
          echo "All Blender download sources failed" >&2
          exit 1

      - name: Add Blender to PATH
        run: echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"

      - name: Run bot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: xvfb-run -a python bot.py

      - name: Commit posted history
        run: |
          set -euo pipefail
          git config user.name "ig-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet && { echo "nothing to record"; exit 0; }
          git commit -m "Record today's post"
          # The job runs for many minutes (render + Instagram polling), so the
          # branch may have moved. A bare push would reject and lose the
          # dedupe key for a post that is already live.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt ${attempt})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Failed to push posted.json after 3 attempts" >&2
          exit 1
