name: Check renewal token (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.SECRETS_PAT }}
        run: |
          echo "length ${#T}; starts github_pat_: $([[ $T == github_pat_* ]] && echo yes || echo no)"
          echo "whitespace chars: $(printf %s "$T" | tr -cd '[:space:]' | wc -c); non-token chars: $(printf %s "$T" | tr -d 'A-Za-z0-9_' | wc -c)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" \
            https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key)
          echo "secrets api: HTTP $code"
